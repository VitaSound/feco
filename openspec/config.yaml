schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: feco — каталог Forth-экосистемы VitaSound (Gforth). Правила для агентов: AGENTS.md.
  Содержимое: README.md / README.ru.md (таблица библиотек), catalog/repos.list, scripts/*.sh,
  data/tags.json и data/coverage.json.
  Таблица версий/покрытия и data/*.json обновляются только скриптами
  (fetch-tags.sh, fetch-coverage.sh, update-readme-versions.sh) или MCP vitasound-forth (fetch_tags, shell_run), не руками.
  Репозитории экосистемы клонируются рядом с feco в FECO_WORKSPACE.
  Изменения, затрагивающие конкретную библиотеку (fmix, flint, fcov, fmcp, fhdlgen …), планируются в её собственном openspec/.

rules:
  specs:
    - Спеки описывают поведение скриптов каталога (входы, выходы, файлы) и состав экосистемы
  tasks:
    - Для изменений скриптов включать проверку на реальном FECO_WORKSPACE

operations:
  apply:
    guidance:
      - Вызывать MCP-инструменты vitasound-forth по одному, с mcp_ping между тяжёлыми вызовами
